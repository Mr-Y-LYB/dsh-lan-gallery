# dsh-lan-gallery 的加载层。
#
# role 说明：
#   auto    默认。本机存在图库目录（~/.dsh/qwen-studio/images）就当电脑端图库源，
#           否则当手机端桥接。同一个包两端通用，不需要改这里。
#   source  强制电脑端：对外提供图库（绑 0.0.0.0，手机才连得上）
#   bridge  强制手机端：把电脑图库代理到同源路径 /api/lan-gallery/*
#
# 下面 sourceUrl / token 只在手机端生效（电脑端 auto 判定为 source 会忽略它们）。
# 若要给别的设备用，把 sourceUrl 改成那台电脑的地址、token 改成两边一致的随机串。
- insert:
    - id: lan-gallery
      name: dsh-lan-gallery
      config:
        role: auto
        # 手机端：电脑在图库服务上的地址
        sourceUrl: "http://26.72.39.30:8765"
        token: "PdO4zVIZqf45-nZ1"
        # 电脑端
        port: 8765
        bind: "0.0.0.0"
        # 缩略图：用本机 Python(Pillow) 生成 512px JPEG，手机上才加载得动
        pythonPath: "E:/AI/ComfyUI/ComfyUI_windows_portable/python_embeded/python.exe"
        thumbSize: 512
        # 索引文件：放在电脑上，发新版本时只替换它，手机端索引源地址不用改
        indexFile: "~/.dsh/lan-gallery-index.json"
        # 外观
        title: "电脑图库"
        order: 11
